  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      touch-action: none;
      /* Prevent canvas panning */
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      transform-origin: top left;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .name-entry {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      font-family: "Courier New", Courier, monospace;
      /* Rapid taps on the touch D-pad could otherwise be misread as a text-selection or
         long-press gesture, popping up the native selection/"Translate" callout menu. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .name-entry.touch-mode {
      gap: 14px;
      /* This panel is top-anchored (translate(-50%, 0)) in touch mode rather than
         centre-anchored, so the scale must pivot from the top too - otherwise scaling
         shifts the top edge downward by half the height difference, an error that grows
         as the canvas shrinks. */
      transform-origin: center top;
    }

    .name-entry input {
      box-sizing: border-box;
      width: 400px;
      padding: 8px 12px;
      border: 3px solid yellow;
      border-radius: 0;
      background: #000000;
      color: yellow;
      font-family: inherit;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    /* On touch devices the name is shown as individual letter slots (classic arcade
       high-score style) and edited with the D-pad below instead of the native keyboard,
       which is unreliable to keep aligned with the canvas when it opens/closes. */
    .touch-name-display {
      display: none;
      gap: 5px;
      /* Reserves a gap below the slots and above the D-pad for the status/error message
         drawn on the canvas (NAME_MESSAGE_Y_TOUCH in NameEntry.js), so it never ends up
         hidden behind the D-pad. */
      margin-bottom: 70px;
    }

    .touch-name-slot {
      box-sizing: border-box;
      width: 42px;
      height: 56px;
      border: 3px solid yellow;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: yellow;
      font-family: inherit;
      font-size: 31px;
      font-weight: bold;
    }

    .touch-name-slot-active {
      background: yellow;
      color: #000000;
    }

    .touch-dpad {
      display: none;
      grid-template-columns: repeat(3, 85px);
      grid-template-rows: repeat(3, 85px);
      gap: 6px;
    }

    .dpad-btn {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #7CFC00;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: #7CFC00;
      font-size: 34px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Manually toggled via JS rather than :active/:focus, since mobile browsers can leave
       :active "stuck" on a button after a tap instead of releasing it on touchend. */
    .dpad-btn.dpad-btn-pressed {
      background: #7CFC00;
      color: #000000;
    }

    .dpad-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .dpad-up {
      grid-column: 2;
      grid-row: 1;
    }

    .dpad-left {
      grid-column: 1;
      grid-row: 2;
    }

    .dpad-right {
      grid-column: 3;
      grid-row: 2;
    }

    .dpad-down {
      grid-column: 2;
      grid-row: 3;
    }

    .name-entry-buttons {
      display: flex;
      gap: 24px;
    }

    .name-entry button {
      padding: 10px 24px;
      border: 2px solid #7CFC00;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: #7CFC00;
      font-family: inherit;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Scoped to .name-entry-buttons specifically (not .name-entry button) so this never
       matches the D-pad buttons, which already have their own explicit pressed-state
       styling. The :hover part is further gated to real hover-capable devices, since on
       touch devices tapping directly on a button triggers a synthetic/simulated :hover
       state that then stays "stuck" until something else is tapped. */
    @media (hover: hover) {
      .name-entry-buttons button:hover {
        background: #7CFC00;
        color: #000000;
        outline: none;
      }
    }

    .name-entry-buttons button:focus-visible {
      background: #7CFC00;
      color: #000000;
      outline: none;
    }

    .name-entry button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Invisible hit-area for the "More @ www.korovatron.co.uk" title screen link - the
       visible pixel-font text is drawn on the canvas (see drawCentredText in main.js); this
       real <a> is positioned exactly over it (see updateMoreLinkLayout in main.js) purely so
       the link is a genuine, accessible, right-clickable/keyboard-focusable hyperlink. Its
       own text is kept for screen readers/crawlers but hidden visually. */
    .more-link {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      display: none;
      color: transparent;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

  <script>
    // Register the service worker for offline play, and auto-reload once
    // when a new version has finished installing and taken control.
    if ("serviceWorker" in navigator) {
      // On a first-ever visit the page loads with no controller yet, and the new
      // service worker (which calls clients.claim()) immediately takes control of it -
      // that alone fires "controllerchange" even though nothing has actually been
      // updated. Only treat controllerchange as "a new version took over" - and worth
      // reloading for - if this page load already had a controller (i.e. an existing
      // install is being replaced), otherwise the title screen would reload itself
      // a split-second after its very first paint.
      const hadController = !!navigator.serviceWorker.controller;

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing || !hadController) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>
